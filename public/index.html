<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Milk — уютный мессенджер</title>
<style>
  :root{
    --milk:#fbf6ef; --cream:#f3e9dc; --latte:#e7d7c3; --cocoa:#6b5645;
    --cocoa-soft:#9b8878; --mint:#cfe3d4; --berry:#e5b8b0; --white:#fffdf9;
    --shadow:0 10px 30px rgba(107,86,69,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Nunito","Segoe UI",system-ui,sans-serif;background:
    radial-gradient(1000px 600px at 10% -10%, #fff7ec, transparent),
    radial-gradient(800px 500px at 110% 110%, #f0e4d6, transparent), var(--milk);
    color:var(--cocoa);height:100vh;overflow:hidden}
  .noise{position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.25'/></svg>")}

  /* login */
  .login{height:100vh;display:grid;place-items:center;position:relative;z-index:2}
  .card{background:var(--white);padding:34px 30px;border-radius:28px;box-shadow:var(--shadow);width:330px;text-align:center;border:1px solid #f0e6d9}
  .logo{font-size:40px}
  h1{font-size:22px;margin:6px 0 2px}
  .sub{font-size:13px;color:var(--cocoa-soft);margin-bottom:18px}
  input{width:100%;padding:13px 16px;margin:7px 0;border-radius:16px;border:1.5px solid var(--cream);
    background:var(--milk);font:inherit;color:var(--cocoa);outline:none;transition:.2s}
  input:focus{border-color:var(--latte);background:#fff}
  button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:16px;background:var(--cocoa);
    color:var(--milk);font:inherit;font-weight:700;cursor:pointer;transition:.2s}
  button:hover{background:#584538;transform:translateY(-1px)}
  .err{color:#b8655c;font-size:13px;min-height:18px;margin-top:8px}
  .hint{margin-top:14px;font-size:11.5px;color:var(--cocoa-soft);line-height:1.6}

  /* app */
  .app{display:none;height:100vh;grid-template-columns:290px 1fr;position:relative;z-index:2}
  @media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}}
  .side{background:rgba(255,253,249,.8);backdrop-filter:blur(8px);border-right:1px solid #f0e6d9;
    display:flex;flex-direction:column;padding:18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin-bottom:18px}
  .chat-item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--white);
    box-shadow:var(--shadow);cursor:pointer;border:1.5px solid var(--cream)}
  .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:20px;background:var(--cream)}
  .av{width:44px;height:44px;border-radius:50%;object-fit:cover;aspect-ratio:1/1;border:2px solid var(--white);box-shadow:0 2px 8px rgba(107,86,69,.15)}
  .av.sm{width:34px;height:34px}
  .nm{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px}
  .badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--mint);color:#4a6b55;letter-spacing:.3px}
  .mut{font-size:12px;color:var(--cocoa-soft)}

  .main{display:flex;flex-direction:column;height:100vh}
  .top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:rgba(255,253,249,.85);
    backdrop-filter:blur(8px);border-bottom:1px solid #f0e6d9}
  .msgs{flex:1;overflow-y:auto;padding:22px 18px;display:flex;flex-direction:column;gap:10px}
  .msgs::-webkit-scrollbar{width:8px}.msgs::-webkit-scrollbar-thumb{background:var(--latte);border-radius:9px}
  .row{display:flex;gap:9px;align-items:flex-end;max-width:min(620px,86%)}
  .row.out{align-self:flex-end;flex-direction:row-reverse}
  .bub{padding:11px 15px;border-radius:22px;background:var(--white);box-shadow:var(--shadow);
    border:1px solid #f2e8db;font-size:14.5px;line-height:1.45;word-break:break-word;animation:pop .25s ease}
  .row.out .bub{background:linear-gradient(135deg,#f7e6d5,#f0dcc6);border-color:#ecdcc8}
  .row .bub{border-bottom-left-radius:8px}.row.out .bub{border-bottom-left-radius:22px;border-bottom-right-radius:8px}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
  .time{font-size:10.5px;color:var(--cocoa-soft);margin-top:4px;text-align:right}
  .day{align-self:center;font-size:11px;color:var(--cocoa-soft);background:var(--cream);padding:4px 12px;border-radius:999px}
  .typing{font-size:12px;color:var(--cocoa-soft);padding:0 22px 4px;height:18px}
  .bar{display:flex;gap:10px;padding:14px 18px;background:rgba(255,253,249,.9);border-top:1px solid #f0e6d9;align-items:center}
  .bar input{margin:0;border-radius:22px}
  .send{width:48px;height:48px;border-radius:50%;flex:0 0 48px;display:grid;place-items:center;margin:0;font-size:18px}
  .emo{display:flex;gap:4px}
  .emo span{cursor:pointer;font-size:19px;padding:4px;border-radius:12px}
  .emo span:hover{background:var(--cream)}
</style>
</head>
<body>
<div class="noise"></div>

<div class="login" id="login">
  <div class="card">
    <div class="logo">🍪</div>
    <h1>Milk</h1>
    <div class="sub">уютный мини-мессенджер ☕</div>
    <input id="u" placeholder="ник" autocomplete="username" />
    <input id="p" type="password" placeholder="пароль" autocomplete="current-password" />
    <button id="go">Войти в уют</button>
    <div class="err" id="err"></div>
    <div class="hint">тестовые аккаунты:<br>vamped · lowyysx &nbsp;|&nbsp; eawie · teawave1</div>
  </div>
</div>

<div class="app" id="app">
  <aside class="side">
    <div class="brand">🍪 Milk</div>
    <div class="chat-item">
      <img class="av" id="peerAv" />
      <div>
        <div class="nm" id="peerNm"></div>
        <div class="mut">онлайн · печеньки 🍪</div>
      </div>
    </div>
    <div class="me" id="meBox" title="Выйти">
      <img class="av sm" id="meAv" />
      <div><div class="nm" id="meNm"></div><div class="mut">это вы · выйти</div></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <img class="av sm" id="topAv" />
      <div><div class="nm" id="topNm"></div><div class="mut">чашка чая всегда рядом 🍵</div></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="typing" id="typing"></div>
    <div class="bar">
      <div class="emo"><span>🍪</span><span>☕</span><span>🍵</span><span>🧸</span><span>🤍</span></div>
      <input id="t" placeholder="напишите что-нибудь тёплое..." />
      <button class="send" id="s">➤</button>
    </div>
  </main>
</div>

<script>
let me, peer, token, ws;
const $ = id => document.getElementById(id);

$('go').onclick = login;
$('p').onkeydown = e => e.key === 'Enter' && login();
$('u').onkeydown = e => e.key === 'Enter' && $('p').focus();

async function login(){
  const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:$('u').value,password:$('p').value})});
  const d = await r.json();
  if(!r.ok){ $('err').textContent = d.error; return; }
  localStorage.setItem('milk', JSON.stringify(d));
  start(d);
}

function start(d){
  me = d.me; peer = d.peer; token = d.token;
  $('login').style.display='none'; $('app').style.display='grid';
  $('peerAv').src=$('topAv').src=peer.avatar; $('meAv').src=me.avatar;
  $('peerNm').innerHTML=$('topNm').innerHTML=nm(peer); $('meNm').innerHTML=nm(me);
  connect();
}
const nm = u => u.name + (u.badge?` <span class="badge">${u.badge}</span>`:'');

function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen = () => ws.send(JSON.stringify({type:'auth',token}));
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if(d.type==='history'){ $('msgs').innerHTML=''; d.messages.forEach(add); }
    if(d.type==='msg') add(d.message);
    if(d.type==='typing'){ $('typing').textContent = peer.name+' печатает...'; clearTimeout(window._tt);
      window._tt=setTimeout(()=>$('typing').textContent='',1500); }
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

function add(m){
  const out = m.from === me.name;
  const row = document.createElement('div');
  row.className = 'row' + (out?' out':'');
  const t = new Date(m.ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  row.innerHTML = `<img class="av sm" src="${out?me.avatar:peer.avatar}">
    <div class="bub">${esc(m.text)}<div class="time">${t}</div></div>`;
  $('msgs').appendChild(row);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}
const esc = s => s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function send(){
  const v = $('t').value.trim(); if(!v) return;
  ws.send(JSON.stringify({type:'msg',text:v})); $('t').value='';
}
$('s').onclick = send;
$('t').onkeydown = e => { if(e.key==='Enter') send(); else ws && ws.send(JSON.stringify({type:'typing'})); };
document.querySelectorAll('.emo span').forEach(s=>s.onclick=()=>{$('t').value+=s.textContent;$('t').focus()});

// восстановление сессии после перезагрузки страницы
try { const saved = JSON.parse(localStorage.getItem('milk')); if(saved) start(saved); } catch(e){}
$('meBox').onclick = () => { localStorage.removeItem('milk'); location.reload(); };
</script>
</body>
</html>
